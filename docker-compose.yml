services:
  # Redis/Valkey — required by SearXNG for result caching
  redis:
    image: docker.io/valkey/valkey:8-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    volumes:
      - valkey-data:/data
    networks:
      - browser-goat-net
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    networks:
      - browser-goat-net
    expose:
      - "8080"
    environment:
      - SEARXNG_SECRET_KEY=${SEARXNG_SECRET_KEY:-change-me-in-production}
      - SEARXNG_BASE_URL=http://searxng:8080/
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng-cache:/var/cache/searxng:rw
    cap_add:
      - CAP_NET_ADMIN
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  browser-goat:
    build: .
    restart: unless-stopped
    networks:
      - browser-goat-net
    ports:
      - "8000:8000"
    environment:
      - SEARXNG_URL=http://searxng:8080
    depends_on:
      searxng:
        condition: service_healthy

networks:
  browser-goat-net:
    driver: bridge

volumes:
  valkey-data:
  searxng-cache: